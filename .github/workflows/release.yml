name: Build Application and Make Release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write
    with:
      build-type: Release
      environment: Release
    secrets: inherit

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-slim
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "true"
          path: "PrismLauncher-source"
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          # CI artifacts keep their PrismLauncher-* names, only the published files are named MkeiitLauncher-*.
          # The updater finds its file by the "Windows-MSVC", "arm64", "Portable" and "Setup" parts, not by the prefix.
          mv ${{ github.workspace }}/PrismLauncher-source MkeiitLauncher-${{ env.VERSION }}
          mv PrismLauncher-macOS*/PrismLauncher.zip MkeiitLauncher-macOS-${{ env.VERSION }}.zip
          mv PrismLauncher-macOS*/PrismLauncher.dmg MkeiitLauncher-macOS-${{ env.VERSION }}.dmg

          tar --exclude='.git' -czf MkeiitLauncher-${{ env.VERSION }}.tar.gz MkeiitLauncher-${{ env.VERSION }}

          for d in PrismLauncher-Windows-MSVC*; do
            cd "${d}" || continue
            LEGACY="$(echo -n ${d} | grep -o Legacy || true)"
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="MkeiitLauncher-Windows-MSVC"
            test -z "${LEGACY}" || NAME="${NAME}-Legacy"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv PrismLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in PrismLauncher-Windows-MinGW-w64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="MkeiitLauncher-Windows-MinGW-w64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv PrismLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref }}
          name: MkeiitLauncher ${{ env.VERSION }}
          # published right away, the launcher updater does not see draft releases
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            MkeiitLauncher-Windows-MinGW-w64-${{ env.VERSION }}.zip
            MkeiitLauncher-Windows-MinGW-w64-Portable-${{ env.VERSION }}.zip
            MkeiitLauncher-Windows-MinGW-w64-Setup-${{ env.VERSION }}.exe
            MkeiitLauncher-Windows-MSVC-arm64-${{ env.VERSION }}.zip
            MkeiitLauncher-Windows-MSVC-arm64-Portable-${{ env.VERSION }}.zip
            MkeiitLauncher-Windows-MSVC-arm64-Setup-${{ env.VERSION }}.exe
            MkeiitLauncher-Windows-MSVC-${{ env.VERSION }}.zip
            MkeiitLauncher-Windows-MSVC-Portable-${{ env.VERSION }}.zip
            MkeiitLauncher-Windows-MSVC-Setup-${{ env.VERSION }}.exe
            MkeiitLauncher-macOS-${{ env.VERSION }}.zip
            MkeiitLauncher-macOS-${{ env.VERSION }}.dmg
            MkeiitLauncher-${{ env.VERSION }}.tar.gz
